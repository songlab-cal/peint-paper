[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peint-paper"
version = "0.1.0"
description = "Paper figures and benchmarks for PEINT (uses the peint model library)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-4.0"}
authors = [{name = "Antoine Koehl"}]

# NOTE: the model library `peint` is NOT listed here — it
# is installed separately and editable: `pip install -e ../peint`. Listing it would
# make pip try to resolve `peint` from PyPI on a fresh env.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "tqdm",
    "biopython",
    "ete3",
    "biotite",
    "logomaker",
    # data/MANIFEST.toml. stdlib tomllib from 3.11; both project envs are still 3.10.
    'tomli; python_version < "3.11"',
]

[project.optional-dependencies]
# PEINT inference / simulation needs torch. It also ships with the `peint` install,
# so this is only for envs where you want peint-paper to pull it explicitly.
model = ["torch>=2.5.0"]

# Structure / folding benchmarks: AF2Rank (JAX/ColabDesign), OmegaFold, ProstT5 (3Di).
# WARNING: JAX + Torch in one env is fragile (CUDA/cuDNN mismatches). Follow the
# tested install order in peint/Installation.md. Two of these are NOT plain PyPI installs:
#   colabdesign: pip install -q git+https://github.com/sokrypton/ColabDesign.git@v1.1.3 --no-deps
#   omegafold  : pip install --no-deps -e <OmegaFold checkout>   (then `omegafold` on PATH)
folding = [
    "torch>=2.5.0",
    "jax[cuda12]>=0.5.0",     # AF2Rank via ColabDesign
    "transformers==4.45.2",   # ProstT5 (sequence -> 3Di states)
    "sentencepiece",          # ProstT5 tokenizer
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
# Populated as figures/benchmarks are migrated in.
include = ["benchmarks*", "paper*", "figures*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]
