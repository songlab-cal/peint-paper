or shared, which is why figure2_likelihood_eval is replot-only for everyone else."""

[[role]]
name = "peint_checkpoints"
producer = "PEINT training runs"
path = "peint/model_checkpoints"
source = "{peint_repo}/model_checkpoints"
exclude = ["*.full.bak", "esmc-biohub"]
tier = "full"
archive = "peint_checkpoints"
probe = "peint.ckpt"
blocks_mb = 6897
apparent_mb = 6898
files = 5
panels = ["figure2_likelihood_eval", "figure2_simulation_generate", "vep_params", "vep_by_base_lm"]
note = """Five checkpoints. The four canonical ones: peint.ckpt and vep.ckpt (ESM2 backbones),
plus peint_esmc.ckpt and vep_esmc.ckpt (Biohub ESM-C). Copied in as-is, optimizer state and all
-- the loader detects which backbone a checkpoint carries and pulls ESM2 from pretrained when
the encoder weights are absent, so there is nothing to strip and nothing to get wrong.

The fifth is vep_650.ckpt (3.5 GB), the ESM2-650M VEP model behind Figure 5's 650M arm:
embed_dim 1280, 2+2 layers, 20 heads, epoch 12 / step 10000 -- i.e. the checkpoint named by the
run "20251110_103831-ft_217fams-esm2_650M-hhfilter90-epoch=12-step=10000-t_1_0" in
figures/figure5_vep.py. No panel loads it directly (the VEP panels read that run's scored CSVs
from local_data/vep/), so it ships as provenance for a published number rather than as an input.
Unlike its siblings it is a FULL checkpoint -- frozen ESM2-650M encoder weights and optimizer
state included -- which is why one file is half this role. Stripping it to PEINT-only the way
peint.ckpt was would cut the role by roughly 3 GB, if that is ever wanted.
Excluded: the *.full.bak originals, and esmc-biohub/ (4.5 GB of alternate epochs and scoring
runs kept for provenance).

Ships in the full tier, so the deposit is self-sufficient for every step that needs a model:
unpacked they land at local_data/peint/model_checkpoints/, which is exactly where
paper_config._checkpoint() looks after the peint checkout. That means a downloader who never
clones the model repo still gets figure2_simulation_generate, figure2_likelihood_eval and both
VEP panels. Anyone with the peint repo checked out keeps using its copies -- the repo wins the
lookup -- so this archive is redundant for producers and essential for everyone else."""
