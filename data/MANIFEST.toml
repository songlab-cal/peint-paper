# Inventory of the data behind the paper's panels.
#
# One entry per logical role: where it lives on the machine that produced it (`source`),
# where it must land relative to `local_data/` (`path`), which archive carries it, and which
# panels break without it. This file is the single source of truth for four consumers:
#
#   scripts/link_local_data.sh     symlink the roles on the producing machine
#   scripts/stage_shared_data.sh   rsync them to the shared cluster account
#   scripts/build_archives.sh      tar them for the data deposit
#   scripts/fetch_local_data.py    download and unpack them again
#
# Keeping it in one place is the point: the role list previously existed three times and
# had already drifted.
#
# Sizes are measured, not estimated. `blocks_mb` is what it costs on the destination (the
# cluster filesystem compresses transparently); `apparent_mb` is what rsync moves and what a
# downloader needs free. For many small files blocks can EXCEED apparent -- `site_rates` is
# 30,104 files averaging 1 KB, so it is 33 MB of content in 78 MB of blocks.
#
# Tiers:
#   figure_data  every table needed to re-render all panels; one small archive
#   full         the inputs behind those tables, so metrics recompute rather than replot
#   on_request   real data, deliberately NOT transferred or deposited (see each note)

version = 1

# Source roots on the machine that PRODUCED the data. They are only used when staging or
# archiving from that machine; a downloader never reads them, because every role resolves under
# local_data/. paper_config takes precedence, then the PEINT_PAPER_* environment variables named
# below, and these placeholders are the last fallback.
[defaults]
data_root = "/path/to/results"          # PEINT_PAPER_DATA_ROOT
sim_root = "/path/to/simulation"        # PEINT_PAPER_SIM_ROOT
gt_pdb_root = "/path/to/ground_truth_pdb"   # PEINT_PAPER_GROUND_TRUTH_STRUCTURE_DIR
peint_repo = "/path/to/peint"           # PEINT_PAPER_PEINT_REPO


# =====================================================================================
#  Archives. Each unpacks relative to local_data/, so `tar -xf X.tar.zst -C local_data/`
#  is the whole instruction.
# =====================================================================================

[[archive]]
name = "figure_data"
file = "figure_data.tar.zst"
note = "per-panel tables. Tarred like everything else: a Zenodo record is a flat list of files, so a directory cannot be deposited."

[[archive]]
name = "r1"
file = "r1.tar.zst"
note = "revision 1: classical baselines, PEINT-ESM2 and real, in the rev1 mafft frame"

[[archive]]
name = "r2"
file = "r2.tar.zst"
note = "revision 2: the ESM-C rerun, in its own mafft frame, incl. the Historian outputs"

[[archive]]
name = "sim"
file = "sim.tar.zst"
note = "trees, root sequences, empirical + simulated MSAs behind the 512-leaf simulation"

[[archive]]
name = "aux"
file = "aux.tar.zst"
note = "annotation labels, per-site rates, family split lists"

# The two rev1 structure trees. These SHIP -- but unlike every other archive they are not built
# by build_archives.sh. stage_shared_data.sh --as-archive already streamed each one into the
# staged tree as a finished .tar.zst (re-tarring ~100 GB apiece to change nothing would be
# absurd), so they are marked `prebuilt` and simply linked into the upload directory.
#
# `unpack_into` is the price of that: --as-archive tarred each role from its SOURCE directory,
# so members are prefixed `af2/` and `omegafold/` rather than `r1/af2/` and `r1/omegafold/`.
# They therefore unpack into local_data/r1/, not local_data/. Every consumer reads this field,
# so the one-line unpack instruction still holds -- it just has a different -C for these two.
[[archive]]
name = "r1_af2"
file = "r1_af2.tar.zst"
prebuilt = true
unpack_into = "r1"
note = "raw rev1 AF2Rank output, 481,316 files. Prebuilt; unpacks into local_data/r1/. Only af2rank_comparisons.csv is needed by any panel."

[[archive]]
name = "peint_checkpoints"
file = "peint_checkpoints.tar.zst"
note = "the four model checkpoints; ships in the full tier. Four big files -- plain rsync, not --as-archive."

[[archive]]
name = "peint_transitions_aligned"
file = "peint_transitions_aligned.tar.zst"
note = "held-out transitions, alignment frame. 90,312 files; feeds figure2_likelihood_eval."

[[archive]]
name = "peint_transitions_unaligned"
file = "peint_transitions_unaligned.tar.zst"
note = "held-out transitions, unaligned. 60,208 files; feeds figure2_likelihood_eval."

[[archive]]
name = "transitions_192l"
file = "transitions_192l.tar.zst"
prebuilt = true
note = "the 192-leaf transition set. 30,104 files; prebuilt, tarred from its source directory."

[[archive]]
name = "r1_omegafold"
file = "r1_omegafold.tar.zst"
prebuilt = true
unpack_into = "r1"
note = "raw rev1 OmegaFold structures, 607,696 files. Prebuilt; unpacks into local_data/r1/. Only omegafold_plddt.csv is needed by any panel."


# =====================================================================================
#  Tier: figure_data -- ~22 MB, replots every panel with no models and no GPU
# =====================================================================================

[[role]]
name = "figure_data"
producer = "the panel scripts themselves (each writes its own table next to its figure)"
path = "figure_data"
archive = "figure_data"
source = "{repo_root}/local_data/figure_data"
tier = "figure_data"
probe = "figure3_conservation_jsd.csv"
blocks_mb = 29
apparent_mb = 40
files = 25
panels = ["all"]
note = "Per-panel tables. The whole replot tier, ~5 MB packed."

[[role]]
name = "vep"
producer = "protevo.vep compute_fitness (PEINT runs) + official_baselines (released ProteinGym columns). The VEP checkpoints ship in peint_checkpoints.tar.zst; the raw per-variant scoring output behind these tables is not redistributed."
path = "vep"
source = "{repo_root}/local_data/vep"
tier = "figure_data"
in_repo = true
probe = "test_lls/production/ESM2_150M/spearman_results.csv"
blocks_mb = 1
apparent_mb = 1
files = 24
panels = ["vep_params", "vep_by_base_lm"]
note = """Per-run ProteinGym Spearman tables, 250 KB across 24 CSVs. `in_repo` means these
are git-tracked and ship with the code, so the deposit neither carries nor overwrites them --
a fetch that wrote over tracked files would dirty the working tree for no gain. The role
still exists so --check can confirm they are there."""


